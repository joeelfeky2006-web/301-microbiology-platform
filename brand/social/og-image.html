<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>
  @font-face { font-family: "Space Grotesk"; src: url("../fonts/SpaceGrotesk-Variable.ttf") format("truetype"); font-weight: 300 700; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0B1230; color: #fff; font-family: "Space Grotesk", Inter, sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(55% 70% at 85% 10%, rgba(91, 61, 245, .55), transparent 70%), radial-gradient(40% 50% at 95% 90%, rgba(33, 227, 192, .18), transparent 70%), radial-gradient(50% 60% at 0% 100%, rgba(35, 80, 255, .35), transparent 70%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 48px 48px; }
  .wrap { position: relative; padding: 78px 84px; height: 100%; display: flex; flex-direction: column; }
  .logo { height: 92px; align-self: flex-start; }
  h1 { font-weight: 700; font-size: 66px; line-height: 1.04; letter-spacing: -.03em; margin-top: 54px; max-width: 900px; }
  h1 span { background: linear-gradient(90deg, #6F8BFF, #21E3C0); -webkit-background-clip: text; color: transparent; }
  p { font-size: 27px; color: #B9C2DC; margin-top: 18px; }
  .row { margin-top: auto; display: flex; align-items: center; gap: 18px; }
  .cta { font-weight: 700; font-size: 24px; padding: 14px 26px; border-radius: 999px; background: linear-gradient(135deg, #2350FF, #5B3DF5); box-shadow: 0 10px 30px rgba(35, 80, 255, .4); }
  .ar { font-family: "IBM Plex Sans Arabic"; font-weight: 600; font-size: 24px; color: #fff; opacity: .85; direction: rtl; }
</style></head><body>
  <div class="glow"></div><div class="grid"></div>
  <div class="wrap">
    <img class="logo" src="../logo/final/svg/medatlas-logo-horizontal-reversed.svg" alt="">
    <h1>AI study lab for <span>Egyptian med students</span></h1>
    <p>Micro 301 beta · Dr. Atlas cases, quizzes and high-yield notes</p>
    <div class="row"><span class="cta">Sign up is free now</span><span class="ar">سجّل ببلاش دلوقتي</span></div>
  </div>
</body></html>
