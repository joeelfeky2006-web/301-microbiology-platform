<!doctype html>
<!-- Facebook feed / link-share image 1200×630 (also usable as the website Open Graph image) -->
<html data-size="1200x630"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1200px; --h: 630px; --h1: 76px; --sub: 26px; }
  .lens { width: 760px; height: 760px; right: -190px; top: -60px; --lens-w: 56px; opacity: .9; }
  .copy { position: absolute; left: 70px; top: 170px; width: 640px; }
  .copy .ar { font: 700 44px/1.3 var(--font-ar); margin-top: 18px; text-align: left; }
  .phone { --pw: 280px; right: 150px; top: 70px; transform: rotate(5deg); }
  .bottom { position: absolute; left: 70px; bottom: 60px; display: flex; gap: 26px; align-items: center; }
</style></head>
<body class="agar"><div class="frame">
  <div class="lens"></div>
  <img class="logo" src="../logo/svg/medatlas-horizontal-reversed.svg" style="left:50px;top:44px;height:86px">
  <div class="copy">
    <div class="h1">Micro 301, <span class="grad-text">powered by AI.</span></div>
    <p class="ar" dir="rtl">باكدجات امتحانات + Dr. Atlas</p>
  </div>
  <div class="phone"><div class="screen"><div class="bar"><img src="../logo/svg/medatlas-horizontal-reversed.svg"></div><img class="site" src="assets/site-home-dark.jpg"></div></div>
  <div class="bottom">
    <span class="cta" style="--cta:26px;padding:18px 28px">Sign up free <span class="arrow">→</span></span>
    <span class="url" style="--url:22px">301-microbiology-platform.vercel.app</span>
  </div>
</div></body></html>
