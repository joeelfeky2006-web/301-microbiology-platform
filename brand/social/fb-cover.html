<!doctype html>
<!-- Facebook page cover 1640×624 (shown at 820×312 desktop; mobile crops the sides — keep content inside the centre 1300px) -->
<html data-size="1640x624"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1640px; --h: 624px; --h1: 60px; }
  .lens { width: 900px; height: 900px; right: -160px; top: -140px; --lens-w: 64px; opacity: .85; }
  .copy { position: absolute; left: 230px; top: 120px; width: 820px; }
  .ar { font: 700 42px/1.3 var(--font-ar); margin-top: 14px; width: max-content; }
  .phone { --pw: 240px; right: 290px; top: 80px; transform: rotate(-5deg); }
  .phone + .phone { right: 150px; top: 140px; transform: rotate(7deg); }
</style></head>
<body class="agar"><div class="frame">
  <div class="lens"></div>
  <div class="copy">
    <img src="../logo/svg/medatlas-horizontal-reversed.svg" style="height:92px;margin:0 0 26px -20px">
    <div class="h1">Next-gen AI training<br>for <span class="grad-text">medical students.</span></div>
    <p class="ar" dir="rtl">ذاكر بذكاء، مش بالساعات</p>
  </div>
  <div class="phone"><div class="screen light"><div class="bar"><img src="../logo/svg/medatlas-horizontal-color.svg"></div><img class="site" src="assets/site-home-light.jpg"></div></div>
  <div class="phone"><div class="screen"><div class="bar"><img src="../logo/svg/medatlas-horizontal-reversed.svg"></div><img class="site" src="assets/site-home-dark.jpg" style="margin-top:-118%"></div></div>
</div></body></html>
