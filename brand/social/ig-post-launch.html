<!doctype html>
<!-- Instagram post 1080×1080. Edit the text, then re-export with brand/_source/export_assets.js -->
<html data-size="1080x1080"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1080px; --h1: 104px; }
  .lens { width: 980px; height: 980px; right: -430px; bottom: -380px; --lens-w: 70px; opacity: .9; }
  .copy { position: absolute; left: 80px; top: 230px; width: 760px; }
  .copy .ar.h1 { text-align: left; }
  .chip { background: rgba(255,255,255,.08); color: var(--teal); font-size: 26px; margin-bottom: 40px; border: 1px solid rgba(33,227,192,.3); }
  .phone { --pw: 330px; right: 50px; bottom: -230px; transform: rotate(-6deg); }
  .bottom { position: absolute; left: 80px; bottom: 80px; display: flex; flex-direction: column; gap: 26px; }
</style></head>
<body class="agar"><div class="frame">
  <div class="lens"></div>
  <img class="logo" src="../logo/svg/medatlas-horizontal-reversed.svg" style="left:56px;top:56px;height:110px">
  <div class="copy">
    <span class="chip"><span class="dot"></span>Micro 301 · BETA</span>
    <div class="h1">Study smarter,<br><span class="grad-text">not longer.</span></div>
    <p class="ar h1" dir="rtl" style="margin-top:22px;font-size:58px;width:max-content">ذاكر بذكاء، مش بالساعات</p>
  </div>
  <div class="phone"><div class="screen"><div class="bar"><img src="../logo/svg/medatlas-horizontal-reversed.svg"></div><img class="site" src="assets/site-home-dark.jpg"></div></div>
  <div class="bottom">
    <span class="cta"><span class="ar">سجّل مجاناً</span> · Sign up free <span class="arrow">→</span></span>
    <span class="url">301-microbiology-platform.vercel.app</span>
  </div>
</div></body></html>
