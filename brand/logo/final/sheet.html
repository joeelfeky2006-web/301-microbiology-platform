<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1800px; background: #E9EDF6; font-family: Inter; padding-bottom: 34px; }
  .top { background: #060A1C; color: #fff; padding: 26px 44px; display: flex; justify-content: space-between; align-items: center; }
  .top b { font: 700 32px Sora; } .top span { font: 500 16px "IBM Plex Mono"; color: #21E3C0; letter-spacing: .08em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 26px 34px 0; }
  .marks { grid-template-columns: repeat(4, 1fr); }
  .cell { border-radius: 22px; height: 270px; display: grid; place-items: center; position: relative; box-shadow: 0 10px 30px rgba(11,18,48,.06); }
  .cell span, .ic span { position: absolute; left: 22px; bottom: 16px; font: 500 14px "IBM Plex Mono"; letter-spacing: .06em; }
  .icons { margin: 20px 34px 0; background: #fff; border-radius: 22px; padding: 30px 40px 50px; display: flex; gap: 60px; align-items: flex-end; }
  .ic { position: relative; display: flex; flex-direction: column; align-items: center; }
  .ic span { position: static; margin-top: 12px; color: #5B6785; }
</style></head><body>
  <div class="top"><b>MedAtlas Egypt · final logo set</b><span>ECG + GIZA · AI SPARK</span></div>
  <div class="grid"><div class="cell" style="background:#fff"><img src="svg/medatlas-logo-horizontal-color.svg" style="height:110px"><span style="color:#5B6785">Primary · colour</span></div><div class="cell" style="background:#0B1230"><img src="svg/medatlas-logo-horizontal-reversed.svg" style="height:110px"><span style="color:#fff">Primary · reversed</span></div><div class="cell" style="background:#fff"><img src="svg/medatlas-logo-stacked-color.svg" style="height:190px"><span style="color:#5B6785">Stacked · colour</span></div><div class="cell" style="background:#0B1230"><img src="svg/medatlas-logo-stacked-reversed.svg" style="height:190px"><span style="color:#fff">Stacked · reversed</span></div><div class="cell" style="background:#fff"><img src="svg/medatlas-logo-horizontal-mono-black.svg" style="height:80px"><span style="color:#5B6785">One colour · black</span></div><div class="cell" style="background:#0B1230"><img src="svg/medatlas-logo-horizontal-mono-white.svg" style="height:80px"><span style="color:#fff">One colour · white</span></div></div>
  <div class="grid marks"><div class="cell" style="background:#fff"><img src="svg/medatlas-mark-color.svg" style="height:120px"><span style="color:#5B6785">Mark · colour</span></div><div class="cell" style="background:#0B1230"><img src="svg/medatlas-mark-reversed.svg" style="height:120px"><span style="color:#fff">Mark · reversed</span></div><div class="cell" style="background:#fff"><img src="svg/medatlas-mark-mono-black.svg" style="height:120px"><span style="color:#5B6785">Mark · black</span></div><div class="cell" style="background:#0B1230"><img src="svg/medatlas-mark-mono-white.svg" style="height:120px"><span style="color:#fff">Mark · white</span></div></div>
  <div class="icons"><div class="ic"><img src="svg/medatlas-app-icon.svg" style="width:160px;height:160px"><span>App icon</span></div><div class="ic"><img src="svg/medatlas-icon-maskable.svg" style="width:160px;height:160px;border-radius:22%"><span>Maskable / Apple</span></div><div class="ic"><img src="svg/medatlas-favicon.svg" style="width:48px;height:48px"><span>Favicon 48</span></div><div class="ic"><img src="svg/medatlas-favicon.svg" style="width:32px;height:32px"><span>32</span></div><div class="ic"><img src="svg/medatlas-favicon-16.svg" style="width:16px;height:16px"><span>16</span></div></div>
</body></html>
