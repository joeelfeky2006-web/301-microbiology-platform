<!doctype html><html><head><meta charset="utf-8">
<style>
@import url("../../../tokens.css");
@font-face { font-family: "Space Grotesk"; src: url("../../../fonts/SpaceGrotesk-Variable.ttf"); font-weight: 300 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { position: relative; font-family: "Space Grotesk", sans-serif; color: #fff; background: #0B1230; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(55% 35% at 50% 30%, rgba(33, 227, 192, .20), transparent 70%),
              radial-gradient(60% 40% at 100% 0%, rgba(91, 61, 245, .50), transparent 70%),
              radial-gradient(60% 40% at 0% 100%, rgba(35, 80, 255, .35), transparent 70%); }
body::after { content: ""; position: absolute; inset: 0; background-size: 54px 54px;
  background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); }
.frame { position: absolute; inset: 0; padding: 150px 84px 230px; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 1; }
.logo { height: 50px; }
.label { margin-top: 130px; font: 500 24px "IBM Plex Mono"; letter-spacing: .16em; color: #21E3C0; text-transform: uppercase; }
.icon { position: relative; margin-top: 50px; width: 300px; height: 300px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #3BF0CF, #12B99B); box-shadow: 0 0 0 22px rgba(33,227,192,.12), 0 0 0 46px rgba(33,227,192,.06), 0 40px 120px rgba(33,227,192,.35); }
.icon svg { width: 150px; height: 150px; }
.pulse { width: 760px; margin-top: 70px; }
.status { margin-top: 36px; display: inline-flex; align-items: center; gap: 16px; padding: 14px 30px; border-radius: 999px;
  background: rgba(33,227,192,.10); border: 2px solid rgba(33,227,192,.35); font: 600 28px "Space Grotesk"; color: #8FF5E2; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: #21E3C0; box-shadow: 0 0 0 6px rgba(33,227,192,.25); }
h1 { margin-top: 60px; font-weight: 700; font-size: 100px; line-height: 1.02; letter-spacing: -.035em; }
.ar { font-family: "IBM Plex Sans Arabic"; direction: rtl; }
.ar.big { margin-top: 30px; font-weight: 700; font-size: 64px; line-height: 1.35; }
.ar.mid { margin-top: 6px; font-weight: 600; font-size: 44px; line-height: 1.4; opacity: .85; }
.thanks { margin-top: 56px; font-size: 34px; line-height: 1.45; opacity: .85; }
.hint { margin-top: auto; font: 500 24px "IBM Plex Mono"; letter-spacing: .04em; opacity: .6; }
</style></head><body><div class="frame">
  <img class="logo" src="../../../logo/final/svg/medatlas-logo-horizontal-reversed.svg" alt="">
  <div class="label">System update · تحديث</div>
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0B1230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <svg class="pulse" viewBox="0 0 380 60"><path d="M0 34 H120 L132 34 L142 14 L152 50 L160 34 H220 L232 34 L242 14 L252 50 L260 34 H380" fill="none" stroke="#21E3C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>
  <div class="status"><span class="dot"></span>All systems working normally</div>
  <h1>Technical issues<br>have been resolved.</h1>
  <div class="ar big">المشاكل التقنية اتحلّت</div>
  <div class="ar mid">كل حاجة رجعت تشتغل طبيعي</div>
  <div class="thanks">Thank you for your patience 💙<br><span class="ar">شكراً على صبركم</span></div>
  <div class="hint">Still seeing a problem? DM us · <span class="ar">لو لسه في مشكلة ابعتلنا</span></div>
</div></body></html>
